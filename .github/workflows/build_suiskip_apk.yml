name: Build Fixed-Signed SuiSkip APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Build APK (Ignore Kotlin Errors)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p keystore app/keystore
          keytool -genkeypair -v -keystore keystore/suiskip_fixed.jks -alias suiskip -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=SuiSkip, OU=Dev, O=Sui, L=CN, S=CN, C=CN" || true
          cp keystore/suiskip_fixed.jks app/keystore/suiskip_fixed.jks || true
          
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          
          # 强制以 Debug 模式编译（Debug 通常对部分 Kotlin 语法警告包容度更高，能直接出安装包）
          ./gradlew assembleDebug -x lint --stacktrace || ./gradlew assembleDebug --continue

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuiSkip-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
